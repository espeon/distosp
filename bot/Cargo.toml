[package]
name = "distosp"
version = "0.2.0"
edition = "2024"

[dependencies]
lex = { path = "../lex" }
dotenvy = "0.15.7"
poise = "0.6.2"
tokio = { version = "1", features = ["full"] }

anyhow = "1.0.104"
atrium-api = "0.25.8"
atrium-xrpc-client = "0.5.15"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
http = "1.5.0"

# Tracing dependencies
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

# OpenTelemetry dependencies (because why not! 🚀)
opentelemetry = "0.33.1"
opentelemetry_sdk = { version = "0.33.1", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["grpc-tonic", "trace"] }
tracing-opentelemetry = "0.34.0"

[dependencies.serenity]
default-features = false
features = [
    "builder",
    "client",
    "gateway",
    "model",
    "utils",
    "collector",
    "framework",
]
version = "0.12.5"
